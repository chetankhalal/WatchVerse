{% extends 'template.html' %}
{% block movies %}
{% for movie in anime.data %}
<div class="mega-card">
    <div class="card">
        <div class="poster"> <img src="{{movie.images.jpg.image_url}}" class="card-img-top" alt="..."> </div>
        <h3> {{movie.title_english}} </h3>
        <h3> {{movie.year}} </h3>
        <span class="tag completed">  {{movie.status}} </span>
    </div>
    <div class="hover-card">
        <div class="poster"> <img src="{{movie.images.jpg.image_url}}" class="card-img-top" alt="..."> </div>
        <h3> {{movie.title_english}} </h3>
        <div class="buttons">
            <form action="" method="post">
                <input type="hidden" name="Title" value="{{movie.Title}}">
                <input type="hidden" name="Poster" value="{{movie.Poster}}">
                <input type="hidden" name="Year" value="{{movie.Year}}">
                <button class="watchlist" name="action" value="watchlist">+ Watchlist</button>
                <a class="watchlist know-more-btn" name="action"
                    href="{{url_for('anime_data', Title = movie.mal_id)}}"> Know More </a>
                <button class="complete" name="action" value="complete"> ✔ </button>
            </form>
        </div>
    </div>

</div>
{% endfor %}
{% endblock movies %}
