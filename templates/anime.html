{% extends 'template.html' %}
{% block movies %}
<div>
    <h3> {{text}} </h3>
</div>
<div class="grid">
    {% for movie in anime.data %}
    <div class="mega-card">
        <div class="card">
            <div class="poster"> <img src="{{movie.images.jpg.image_url}}" class="card-img-top" alt="..."> </div>
            <h3> {{movie.title_english}} </h3>
            <h3> {{movie.year}} </h3>
            <span class="tag completed"> {{movie.status}} </span>
        </div>
        <div class="hover-card">
            <div class="poster"> <img src="{{movie.images.jpg.image_url}}" class="card-img-top" alt="..."> </div>
            <h3> {{movie.title_english}} </h3>
            <div class="buttons">
                <form action="" method="post">
                    <input type="hidden" name="movie_id" value="{{movie.mal_id}}">
                    <input type="hidden" name="Title" value="{{movie.title_english}}">
                    <input type="hidden" name="Poster" value="{{movie.images.jpg.image_url}}">
                    <input type="hidden" name="Rating" value="{{movie.year}}">
                    <button class="watchlist" name="action" value="watchlist">+ Watchlist</button>
                    <a class="watchlist know-more-btn" name="action"
                        href="{{url_for('anime_data', id = movie.mal_id)}}"> Know More </a>
                    <button class="complete" name="action" value="complete"> ✔ </button>
                </form>
            </div>
        </div>

    </div>
    {% endfor %}
</div>
{% endblock movies %}
